[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "GeometricalDomination"
version = "5.1.0"
description = "A Python turtle graphics library and DSL for creating geometric drawings."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "UniversalFunctions>=3.1.0",
    "TurtleExtension>=1.0.0",
    "numpy",
]

authors = [
    { name = "Miah M. Sabiq", email = "miah.sabiq@gibs.at"}
]

[tool.setuptools.packages.find]
include = [
    "gd*",
    "shapes_multiverse*",
]

[tool.ruff.lint]
ignore = [
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"gd/user_features/user_commands.py" = [
    "S102",
    "BLE001",
]